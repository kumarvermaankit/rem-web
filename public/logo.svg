<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#49A1FF"/>
      <stop offset="100%" style="stop-color:#2F88FF"/>
    </linearGradient>
  </defs>

  <!-- Chat bubble -->
  <rect x="40" y="40" width="320" height="320" rx="72" fill="url(#grad)"/>

  <!-- Ping waves -->
  <circle cx="200" cy="180" r="28" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5"/>
  <circle cx="200" cy="180" r="52" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4"/>
  <circle cx="200" cy="180" r="76" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

  <!-- Dot in center -->
  <circle cx="200" cy="180" r="10" fill="white"/>

  <!-- Small chat dots at bottom -->
  <circle cx="160" cy="280" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="185" cy="280" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="210" cy="280" r="6" fill="rgba(255,255,255,0.7)"/>
</svg>
